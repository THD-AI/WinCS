  <polygon points="441.4,238.7 453.6,232.5 447.5,192.2 476.1,204.6 491.0,186.0 488.3,226.3 506.0,240.2 498.5,265.1 504.6,308.4 484.2,300.7 474.7,341.0 463.2,317.8 443.4,331.7 447.5,283.6 438.0,271.2" fill="#f178a4" fill-opacity=".08" stroke="#f178a4" stroke-width="2" stroke-dasharray="6 7"/>
  <polygon points="861.3,227.8 848.0,221.0 854.6,176.8 823.6,190.4 807.3,170.0 810.2,214.2 791.0,229.5 799.1,256.7 792.5,304.3 814.7,295.8 825.0,340.0 837.6,314.5 859.1,329.8 854.6,277.1 865.0,263.5" fill="#f178a4" fill-opacity=".08" stroke="#f178a4" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="110" cy="212" r="6" fill="#edbc70"/>
  <path d="M110 220 V238 M102 227 H119 M110 238 l-7 11 M110 238 l7 11" fill="none" stroke="#edbc70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <path d="M100 300 C280 375 475 336 595 346 S980 365 1300 320" fill="none" stroke="#62c7bb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="48" y="395" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#a4b9ad">PLAY: follow broad reconnected contours. The banks look displaced; landing widths stay generous.</text>
  <text x="45" y="450" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e8f0e2">B / ECHO: the reflection keeps geometry that the bank has lost</text>
