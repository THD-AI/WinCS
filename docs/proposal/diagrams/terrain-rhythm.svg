  <path d="M595 623 L600 657 M620 625 L620 673 M645 623 L640 657" fill="none" stroke="#62c7bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="3 5"/>
  <circle cx="350" cy="525" r="6" fill="#edbc70"/>
  <path d="M350 533 V551 M342 540 H359 M350 551 l-7 11 M350 551 l7 11" fill="none" stroke="#edbc70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="48" y="735" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#a4b9ad">PLAY: read the persistent reflection as a clue; only a confirmed, solid route supports the player.</text>
  <text x="45" y="788" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e8f0e2">C / FOLD: two distant shores share a broken address</text>
  <path d="M45 913 C130 930 168 830 250 871 S357 963 438 907 S532 867 595 899 M785 923 C857 888 915 817 993 863 S1115 964 1205 910 S1298 884 1335 895" fill="none" stroke="#e8f0e2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
