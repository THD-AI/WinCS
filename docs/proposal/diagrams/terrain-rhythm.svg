<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img" aria-labelledby="title desc">
  <title id="title">Three chaotic creek terrain variants</title>
  <desc id="desc">Asymmetric soft banks delaminate in a slip, missing geometry persists as a reflection echo, and two distant shores are joined by a folded-address portal. Active pale contours are distinct from dashed echoes. These are alternative candidate mechanics, not one stacked level.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#edbc70" stroke-width="1.6"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#27403f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#102328"/>
  <rect x="20" y="110" width="1360" height="905" fill="url(#grid)" opacity=".55"/>
  <text x="40" y="48" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#e8f0e2">THE CREEK IS LOSING ITS SHAPE</text>
  <text x="40" y="83" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#a4b9ad">Three possible faults. Choose one; do not stack all three into the same crossing.</text>
  <text x="45" y="137" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e8f0e2">A / SLIP: a bank fragment comes back at the wrong height</text>
