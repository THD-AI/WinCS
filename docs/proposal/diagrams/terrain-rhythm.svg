<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc"><title id="title">Gentle creek terrain rhythm</title><desc id="desc">Broad crests and troughs describe a proposed walking profile above water. This is an authored design schematic, not final pixel art.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#a6633c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#213d39">THE CREEK: RISE, DIP, RISE</text><text x="40" y="82" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#213d39">Source motif: stepping stones and banks. Stage translation: broad, flowing terrain changes.</text><rect x="40" y="120" width="1120" height="255" rx="14" fill="#e2ece1"/><path d="M40 275 C110 275 120 165 210 180 S315 315 400 265 S500 160 580 205 S685 320 770 260 S890 160 970 215 S1080 295 1160 250 V375 H40Z" fill="#7a9167"/><path d="M40 275 C110 275 120 165 210 180 S315 315 400 265 S500 160 580 205 S685 320 770 260 S890 160 970 215 S1080 295 1160 250" fill="none" stroke="#344f3b" stroke-width="7"/><path d="M65 331 Q170 315 270 335 T500 335 T730 335 T955 335 T1140 335" fill="none" stroke="#6e9da6" stroke-width="10"/><text x="150" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">crest</text><text x="330" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">dip</text><text x="520" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">crest</text><text x="690" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">dip</text><text x="900" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">crest</text><text x="55" y="410" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#213d39">Walking rhythm ≠ a precision-jump gauntlet.</text><text x="55" y="446" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#213d39">Low rounded banks, shallow rises and generous footholds; occasional short gaps only where useful.</text><text x="55" y="484" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#213d39">Painted contour, collision contour and reflection FX are separate authoring layers.</text><text x="55" y="526" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Schematic only: no heights, jump distances or final pixel style have been approved.</text></svg>