  <ellipse cx="555" cy="878" rx="22" ry="49" fill="#62c7bb" fill-opacity=".12" stroke="#62c7bb" stroke-width="4"/>
  <ellipse cx="825" cy="890" rx="22" ry="49" fill="#62c7bb" fill-opacity=".12" stroke="#62c7bb" stroke-width="4"/>
  <path d="M573 871 C640 796 746 802 804 877" fill="none" stroke="#edbc70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/>
  <polygon points="604.2,886.3 637.3,882.6 620.8,858.7 698.0,866.0 738.5,855.0 731.2,878.9 779.0,887.2 758.8,901.9 775.3,927.7 720.1,923.1 694.4,947.0 663.1,933.2 609.7,941.5 620.8,913.0 595.0,905.6" fill="#f178a4" fill-opacity=".08" stroke="#f178a4" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="315" cy="890" r="6" fill="#edbc70"/>
  <path d="M315 898 V916 M307 905 H324 M315 916 l-7 11 M315 916 l7 11" fill="none" stroke="#edbc70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
  <text x="48" y="1000" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#a4b9ad">PLAY: one paired-anchor transition, safe feet and a recognizable exit. No wall-walking controller required.</text>
  <text x="45" y="1060" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#edbc70">Solid = active footing  /  dashed = ghost or old state  /  jagged region = bounded fault patch</text>
  <text x="45" y="1098" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#a4b9ad">Original design schematics. The photographed stones inspire form and rhythm, not these impossible geometries.</text>
</svg>
