  <path d="M430 250 Q465 251 490 270 C550 250 605 288 655 261" fill="none" stroke="#f178a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" stroke-dasharray="8 9"/>
