  <text x="40" y="48" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#e8f0e2">UNDER THE BRIDGE: A SMALL CASCADE OF WRONG</text>
  <text x="40" y="83" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#a4b9ad">Deletion + displaced structure + stale afterimages. One selected outcome; a stable rail route after the tell.</text>
