<svg xmlns="http://www.w3.org/2000/svg" width="1225" height="585" viewBox="0 0 1225 585" role="img" aria-labelledby="title desc"><title id="title">Changing crossing geometry</title><desc id="desc">Two schematic states: the lower path initially exists; after a warned glitch it disappears and the player uses the upper rail route. Art and collision change together.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#a6633c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#213d39">UNDER THE BRIDGE: THE ROUTE FAILS, THEN CHANGES</text><text x="40" y="80" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#213d39">One authored normal / corrupted pair. Preview the alternate route before removing the path.</text><rect x="40" y="115" width="550" height="320" rx="14" fill="#e6e8df"/><text x="60" y="150" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#213d39">A  NORMAL</text><path d="M50 195 H580" stroke="#535b55" stroke-width="20"/><path d="M120 195 V390 M510 195 V390" stroke="#535b55" stroke-width="18"/><path d="M180 288 H485 M200 288 V345 M280 288 V345 M360 288 V345 M440 288 V345" fill="none" stroke="#9b6b4d" stroke-width="8"/><path d="M60 360 H570" stroke="#58714d" stroke-width="16"/><text x="64" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">Lower walkable path; upper rail route is visible.</text><rect x="635" y="115" width="550" height="320" rx="14" fill="#e6e8df"/><text x="655" y="150" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#213d39">B  CORRUPTED</text><path d="M645 195 H1175" stroke="#535b55" stroke-width="20"/><path d="M715 195 V390 M1105 195 V390" stroke="#535b55" stroke-width="18"/><path d="M775 288 H1080 M795 288 V345 M875 288 V345 M955 288 V345 M1035 288 V345" fill="none" stroke="#9b6b4d" stroke-width="8"/><path d="M655 360 H760 M1080 360 H1165" stroke="#58714d" stroke-width="16"/><path d="M765 360 H1075" stroke="#b86e83" stroke-width="10" stroke-dasharray="9 17"/><path d="M710 345 Q735 255 810 264 H1030 Q1085 264 1120 345" fill="none" stroke="#a6633c" stroke-width="4" marker-end="url(#arrow)"/><text x="659" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">Lower path gone; climb / traverse over the rails.</text><text x="40" y="478" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#213d39">Tell → safe commit → matching artwork + collision swap → traverse → stable exit.</text><text x="40" y="516" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#213d39">Keep one checkpoint and a safe retry. Do not delete the floor under a player without warning.</text><text x="40" y="552" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">404/glitch styling remains provisional until Alexander supplies the Voyager references.</text></svg>