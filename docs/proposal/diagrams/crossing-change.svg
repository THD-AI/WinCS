  <title id="title">A cascading crossing fault with three readable phases</title>
  <desc id="desc">Three side-on design states show an intact lower path, a localized warned fracture, and a missing lower route beneath settled displaced rails. The upper route is solid after commitment; dashed old surfaces are non-colliding echoes. The player has a safe waiting area and retry.</desc>
