<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="680" viewBox="0 0 1330 680" role="img" aria-labelledby="title desc"><title id="title">Proposed world route</title><desc id="desc">Read across the top then right to left below: Hidden Garden, campus, Lost in the Green, crossings, creek, Toxic Garden. Playground is optional.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#a6633c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#213d39">A ROUTE THROUGH THE GLITCH</text><text x="40" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Proposed world sequence · terrain and mechanic rhythm, not a measured campus map</text><rect x="40" y="120" width="390" height="200" rx="16" fill="#fffdf6" stroke="#738b69" stroke-width="3"/><text x="60" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#738b69">1  HIDDEN GARDEN</text><text x="60" y="197" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Lake touch → mirror arrival</text><text x="60" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">Quiet reveal / learn the rule</text><path d="M60 286 C105 275 100 249 150 264 S205 314 255 280 S325 258 405 283" fill="none" stroke="#738b69" stroke-width="5"/><rect x="470" y="120" width="390" height="200" rx="16" fill="#fffdf6" stroke="#c38d6e" stroke-width="3"/><text x="490" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c38d6e">2  CAMPUS LEDGES</text><text x="490" y="197" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Recognizable architecture, wrong path</text><text x="490" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">Simple puzzle / bugged ledges</text><path d="M490 292 H580 L635 266 H710 L750 285 H835" fill="none" stroke="#c38d6e" stroke-width="5"/><rect x="900" y="120" width="390" height="200" rx="16" fill="#fffdf6" stroke="#5a7850" stroke-width="3"/><text x="920" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5a7850">3  LOST IN THE GREEN</text><text x="920" y="197" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Grassy channels and screened paths</text><text x="920" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">Navigation / optional stealth</text><path d="M920 286 C965 275 960 249 1010 264 S1065 314 1115 280 S1185 258 1265 283" fill="none" stroke="#5a7850" stroke-width="5"/><rect x="900" y="370" width="390" height="200" rx="16" fill="#fffdf6" stroke="#9f6b48" stroke-width="3"/><text x="920" y="408" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9f6b48">4  RUSTY CROSSINGS</text><text x="920" y="447" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Lower path disappears; go over rails</text><text x="920" y="478" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">One terrain-state traversal</text><path d="M920 542 H1010 L1065 516 H1140 L1180 535 H1265" fill="none" stroke="#9f6b48" stroke-width="5"/><rect x="470" y="370" width="390" height="200" rx="16" fill="#fffdf6" stroke="#638e96" stroke-width="3"/><text x="490" y="408" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#638e96">5  STEPPING-STONE CREEK</text><text x="490" y="447" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Rise, dip, rise · water and reflections</text><text x="490" y="478" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">Gentle exploration / a breathing beat</text><path d="M490 536 C535 525 530 499 580 514 S635 564 685 530 S755 508 835 533" fill="none" stroke="#638e96" stroke-width="5"/><rect x="40" y="370" width="390" height="200" rx="16" fill="#fffdf6" stroke="#8a8550" stroke-width="3"/><text x="60" y="408" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8a8550">6  TOXIC GARDEN</text><text x="60" y="447" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Plants, rocks and rust-edged passages</text><text x="60" y="478" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#213d39">Maze / optional combat</text><path d="M60 536 C105 525 100 499 150 514 S205 564 255 530 S325 508 405 533" fill="none" stroke="#8a8550" stroke-width="5"/><path d="M435 220 H462" stroke="#a6633c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M865 220 H892" stroke="#a6633c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1095 325 V362" stroke="#a6633c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M895 470 H872" stroke="#a6633c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M465 470 H438" stroke="#a6633c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="615" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Playground: optional horror detour; placement and scope stay open. Robot: optional item, not a stage.</text><text x="40" y="646" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#213d39">Jam slice: lake / garden first; add at most one small terrain change after a complete playable loop.</text></svg>