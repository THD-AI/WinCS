<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="1120" viewBox="0 0 1430 1120" role="img" aria-labelledby="title desc">
  <title id="title">A route through localized spatial faults</title>
  <desc id="desc">A chaotic map of six fragmented terrain islands. Numbered locations retain the world order while local faults duplicate ledges, loop paths, shear a bridge, split banks and rewire a garden. Pale solid contours are footing; dashed pink contours are echoes.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#edbc70" stroke-width="1.6"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#27403f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#102328"/>
  <rect x="20" y="110" width="1390" height="895" fill="url(#grid)" opacity=".55"/>
  <text x="40" y="48" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#e8f0e2">A ROUTE THROUGH THE GLITCH</text>
  <text x="40" y="82" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#a4b9ad">Six places. Six different ways reality fails. The world order survives the coordinate disaster.</text>
