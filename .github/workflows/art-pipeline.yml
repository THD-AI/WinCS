name: Art pipeline invariants
on:
  pull_request:
    paths:
      - scripts/**
      - requirements-art.txt
      - .github/workflows/art-pipeline.yml
      - art/**
  # main is checked again after every merge: a stack merged bottom-up can still break it
  push:
    branches: [main]
    paths:
      - scripts/**
      - requirements-art.txt
      - .github/workflows/art-pipeline.yml
      - art/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: art-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  art-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-art.txt
      - run: python -m pip install -r requirements-art.txt
      # pytest runs both styles: unittest classes and plain test functions (unittest discover skipped the latter)
      - run: python -m pytest scripts -v -p no:cacheprovider
      - run: python scripts/creek_layers.py
      - run: python scripts/split_layers.py --check
      - run: python scripts/collision_check.py
      - run: python scripts/export_stage.py --verify --out tmp/stage-export
      - run: python scripts/check_docs.py
      - run: python scripts/assets.py status --strict
