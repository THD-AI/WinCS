name: Art pipeline invariants
on:
  pull_request:
    paths:
      - scripts/stage_art.py
      - scripts/test_stage_art.py
      - requirements-art.txt
      - .github/workflows/art-pipeline.yml
      - references/production/seam-pipeline/stage.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-art.txt
      - run: python -m pip install -r requirements-art.txt
      - run: python -m unittest discover -s scripts -p test_stage_art.py -v
      - run: python scripts/check_docs.py
