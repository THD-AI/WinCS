name: Art pipeline invariants
on:
  pull_request:
    paths:
      - scripts/**
      - requirements-art.txt
      - .github/workflows/art-pipeline.yml
      - art/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-art.txt
      - run: python -m pip install -r requirements-art.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/creek_layers.py
      - run: python scripts/check_docs.py
