name: Game
on:
  pull_request:
    paths:
      - game/**
      - .github/workflows/game.yml
  push:
    branches: [main]
    paths:
      - game/**
      - .github/workflows/game.yml
permissions:
  contents: read
concurrency:
  group: game-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
