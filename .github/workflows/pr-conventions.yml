name: PR conventions

# pull_request_target so that fork PRs can be labelled and assigned. The job checks
# out the default branch only and never runs code from the pull request.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: PR conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Label by changed paths
        uses: actions/labeler@v5
        with:
          sync-labels: false
      - name: Check title and issue link, assign author
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/pr-conventions.cjs')({ github, context, core });
