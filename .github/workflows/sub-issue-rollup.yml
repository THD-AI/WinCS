name: Sub-issue roll-up

# Labels a parent issue `ready-for-acceptance` when its last sub-issue closes,
# and removes the label when one reopens. Parents are never closed automatically.
on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: rollup-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/sub-issue-rollup.cjs')({ github, context, core });
